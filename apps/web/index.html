<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vidyut - Scholarship Application Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <style>
    body {
      margin: 0;
      background-color: #f8fafc;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    @keyframes shimmerBar {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }
  </style>
  <body>
    <div id="root">
      <div style="position:fixed;inset:0;background-color:#f8fafc;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#0f172a;padding:20px;text-align:center;">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">
          <div style="width:40px;height:40px;background:#1e40af;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#ffffff;box-shadow:0 4px 10px rgba(30,64,175,0.22);">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
              <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
            </svg>
          </div>
          <div style="text-align:left;">
            <div style="display:flex;align-items:center;gap:8px;">
              <span style="font-size:19px;font-weight:800;color:#0f172a;letter-spacing:-0.02em;">Vidyut</span>
              <span style="font-size:10px;font-weight:700;color:#059669;background-color:#ecfdf5;border:1px solid #d1fae5;padding:1px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:0.04em;">विद्युत</span>
            </div>
            <span style="font-size:12px;color:#64748b;display:block;font-weight:500;">Scholarship Platform</span>
          </div>
        </div>

        <div style="width:100%;max-width:540px;background-color:#ffffff;border:1px solid #e2e8f0;border-radius:16px;padding:24px 28px;box-shadow:0 10px 25px -5px rgba(15,23,42,0.05),0 8px 10px -6px rgba(15,23,42,0.03);margin-bottom:24px;">
          <div style="display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:0.02em;color:#b45309;background-color:#fffbeb;border:1px solid #fde68a;margin-bottom:12px;">
            ⚡ Reality Check
          </div>
          <p style="font-size:14.5px;line-height:1.6;color:#1e293b;font-weight:500;margin:0 0 10px;">
            &ldquo;Filling 47 government scholarship forms manually was a personality test no student ever asked for.&rdquo;
          </p>
          <div style="font-size:12px;font-weight:600;color:#64748b;">— Every Indian College Student</div>
        </div>

        <div style="width:100%;max-width:240px;height:3px;background-color:#e2e8f0;border-radius:3px;overflow:hidden;position:relative;margin-bottom:12px;">
          <div style="position:absolute;top:0;left:0;width:50%;height:100%;background:linear-gradient(90deg,transparent,#1e40af 40%,#059669 80%,transparent);border-radius:3px;animation:shimmerBar 1.6s ease-in-out infinite;"></div>
        </div>

        <div style="font-size:12px;color:#64748b;font-weight:500;display:flex;align-items:center;gap:6px;">
          <span style="width:6px;height:6px;border-radius:50%;background-color:#059669;display:inline-block;"></span>
          <span>Initializing secure scholarship platform...</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
